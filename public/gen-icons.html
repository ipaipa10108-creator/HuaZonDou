<!DOCTYPE html>
<html>

<body>
    <canvas id="canvas"></canvas>
    <script>
        // 這是一個輔助腳本，用於生成不同尺寸的圖示
        const sizes = [192, 512];
        const img = new Image();
        img.src = 'icon-original.jpg';
        img.onload = () => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            sizes.forEach(size => {
                canvas.width = size;
                canvas.height = size;
                ctx.drawImage(img, 0, 0, size, size);
                console.log(`Generated ${size}x${size} data URL:`, canvas.toDataURL('image/png').substring(0, 100) + '...');
            });
        };
    </script>
</body>

</html>
